version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lms-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lms_db
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lms-network

  webapp:
    build: ./app
    container_name: lms-webapp
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: lms_db
    depends_on:
      - db
    networks:
      - lms-network

  nginx:
    image: nginx:latest
    container_name: lms-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - webapp
    networks:
      - lms-network

  prometheus:
    image: prom/prometheus:latest
    container_name: lms-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - lms-network

  grafana:
    image: grafana/grafana:latest
    container_name: lms-grafana
    restart: always
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - lms-network

  loki:
    image: grafana/loki:2.9.0
    container_name: lms-loki
    ports:
      - "3100:3100"
    networks:
      - lms-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: lms-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  db_data:
