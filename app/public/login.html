<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center text-primary mb-3">Hệ thống LMS</h3>
        
        <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">Đăng nhập</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#register">Đăng ký</button></li>
        </ul>

        <div class="tab-content">
            <!-- Đăng nhập -->
            <div class="tab-pane fade show active" id="login">
                <form id="loginForm">
                    <input type="email" id="l-email" class="form-control mb-2" placeholder="Email" required>
                    <input type="password" id="l-password" class="form-control mb-3" placeholder="Mật khẩu" required>
                    <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                </form>
                <div id="login-msg" class="mt-2 text-center text-danger fw-bold"></div>
            </div>
            
            <!-- Đăng ký -->
            <div class="tab-pane fade" id="register">
                <form id="registerForm">
                    <input type="text" id="r-name" class="form-control mb-2" placeholder="Họ tên" required>
                    <input type="email" id="r-email" class="form-control mb-2" placeholder="Email" required>
                    <input type="password" id="r-password" class="form-control mb-3" placeholder="Mật khẩu" required>
                    <button type="submit" class="btn btn-success w-100">Đăng ký ngay</button>
                </form>
                <div id="reg-msg" class="mt-2 text-center text-success fw-bold"></div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Nếu đã đăng nhập thì chuyển luôn vào trang chủ
    if (localStorage.getItem('lms_user')) window.location.href = '/';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: document.getElementById('l-email').value, password: document.getElementById('l-password').value })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('lms_user', JSON.stringify(data.user)); // Lưu trạng thái
            window.location.href = '/'; // Chuyển trang
        } else {
            document.getElementById('login-msg').innerText = data.message;
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: document.getElementById('r-name').value, email: document.getElementById('r-email').value, password: document.getElementById('r-password').value })
        });
        const data = await res.json();
        document.getElementById('reg-msg').innerText = data.message;
        if(res.ok) document.getElementById('registerForm').reset();
    });
</script>
</body>
</html>
